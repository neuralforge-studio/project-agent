# project-agent tmux integration. Read it with `source-file`; `tmux.conf` of the installation does.
#
# Every tmux reads this file, so it uses only syntax that tmux 2.x parses. It reads
# project-agent-main.conf (the integration itself, which needs a newer tmux) only when the running
# tmux is at least @project_agent_tmux_min. An older tmux gets one error line that names the
# minimum and the company tmux, and nothing is bound. The line is an error on purpose: tmux shows
# the errors of its configuration to the first client, and nothing else is shown there.
# The installer's `check` reads the minimum from the next line (install contract 3).
set-option -g @project_agent_tmux_min '3.8'
if-shell 'k() { v=${1#next-}; a=${v%%.*}; b=${v#*.}; b=${b%%[!0-9]*}; case $a in ""|*[!0-9]*) echo 0; return;; esac; echo $((a * 1000 + ${b:-0})); }; [ "$(k "#{version}")" -ge "$(k "#{@project_agent_tmux_min}")" ]' 'source-file -F "#{d:current_file}/project-agent-main.conf"' 'set-option -gu "project-agent needs tmux 3.8 or newer: put /primehome/tools/Inhouse/tmux/latest/bin first in PATH"'
set-option -gu @project_agent_tmux_min
