# Project Board uses one global toggle and places a pane only in windows seen by clients.
# The click binding keeps tmux's default mouse forwarding in every other pane.
bind-key B run-shell -b '~/.local/bin/project-board toggle --socket #{q:socket_path}'
bind-key -T root MouseDown1Pane if-shell -F '#{==:#{@project_board_pane},#{mouse_pane}}' {
    run-shell -b '~/.local/bin/project-board click --client #{q:client_name} --pane #{q:mouse_pane} --x #{mouse_x} --y #{mouse_y} --socket #{q:socket_path}'
} {
    select-pane -t =
    send-keys -M
}

# Hooks are named so reloading this file replaces these entries, not other plugins' hooks.
set-hook -g client-attached[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g client-detached[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g client-session-changed[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g session-window-changed[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g window-created[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g window-closed[board] 'run-shell -b "~/.local/bin/project-board sync --socket #{q:socket_path}"'
set-hook -g after-resize-pane[board] {
    if-shell -F '#{==:#{@project_board_managed},1}' {
        run-shell -C 'set-option -g @project_board_width #{pane_width}'
    }
}

# agent-session closes a dead managed window only when its managed pane is alone.
# Remove Board's pane synchronously when that managed pane dies.
set-hook -g pane-died[board] {
    if-shell -F '#{&&:#{==:#{@agent_session_pane_id},"#{pane_id}"},#{!=:#{@project_board_pane},}}' {
        run-shell -C 'kill-pane -t #{@project_board_pane}'
        run-shell -C 'set-option -wu -t #{window_id} @project_board_pane'
        run-shell -C 'set-option -wu -t #{window_id} @project_board_restore'
    }
}
