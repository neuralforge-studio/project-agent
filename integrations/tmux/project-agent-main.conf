# project-agent tmux integration, the part that needs a newer tmux (project-agent.conf reads this
# file and sets the minimum). The directory of this file, as it was read, is kept so that every
# command below runs the helpers next to this file. An installation reads it through the `current`
# link, so the next call after an upgrade runs the new release.
set-option -gF @project_agent_tmux_dir '#{d:current_file}'

# Project Board uses one global toggle and places a pane only in windows seen by clients.
# project_agent_bind.sh binds the Board key (@project_agent_board_key, default B) in the prefix
# table and MouseDown1Pane in the root table, unless the user has bound them to something else.
# The skipped keys are left in @project_agent_board_skipped.
run-shell '#{q:@project_agent_tmux_dir}/project_agent_bind.sh --socket #{q:socket_path}'

# The decision count for the status line. A user adds it to status-right (or any status option):
#   set-option -ag status-right '#{E:@project_agent_decide_status}'
set-option -g @project_agent_decide_status '#(#{q:@project_agent_tmux_dir}/tmux_decide_status.sh)'

# Hooks are named so that reading this file again replaces these entries and nothing else.
set-hook -g client-attached[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g client-detached[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g client-session-changed[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g session-window-changed[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g window-created[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g window-closed[project-agent] 'run-shell -b "#{q:@project_agent_tmux_dir}/tmux_project_board.sh sync --socket #{q:socket_path}"'
set-hook -g after-resize-pane[project-agent] {
    if-shell -F '#{==:#{@project_board_managed},1}' {
        run-shell -C 'set-option -g @project_board_width #{pane_width}'
    }
}

# agent-session closes a dead managed window only when its managed pane is alone.
# Remove Board's pane synchronously when that managed pane dies.
# The option name is agent_session.api.PANE_ID_OPTION (defined in agent_session/tmux.py); tmux config cannot import it.
set-hook -g pane-died[project-agent] {
    if-shell -F '#{&&:#{==:#{@agent_session_pane_id},"#{pane_id}"},#{!=:#{@project_board_pane},}}' {
        run-shell -C 'kill-pane -t #{@project_board_pane}'
        run-shell -C 'set-option -wu -t #{window_id} @project_board_pane'
        run-shell -C 'set-option -wu -t #{window_id} @project_board_restore'
    }
}
