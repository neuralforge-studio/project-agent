[package]
name = "project-board-sidebar"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Project Board sidebar of project-agent (BOARD-018)"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
unicode-width = "0.2"
signal-hook = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = false
debug = false
strip = true
