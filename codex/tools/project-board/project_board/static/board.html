<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="board-token" content="__BOARD_TOKEN__">
<title>노냐?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout, colors and motion follow docs/project-board-mockup.html and docs/project-board-plan.md section 4. */
:root {
    --ground: #F3F4F6;
    --surface: #FFFFFF;
    --floor: #F8F9FB;
    --wall: #CFD5DD;
    --line: #B8BFC9;
    --line-soft: #D5DAE1;
    --line-faint: #E3E6EA;
    --ink: #1D2330;
    --muted: #5B6472;
    --work: #2563EB;
    --work-line: #BFD0F5;
    --select-bg: #EAF1FE;
    --select-line: #A9C2F5;
    --hover-bg: #F0F4FC;
    --decide: #B4410E;
    --decide-bg: #FFF3EB;
    --decide-line: #F1C3A5;
    --ghost: #AEB5C0;
    --stopped: #C3C9D2;
    --error: #B42318;
    --error-bg: #FEF3F2;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans KR', system-ui, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); }
button, textarea, input { font: inherit; color: inherit; }
.page { max-width: 1180px; margin: 0 auto; padding: 40px 16px 80px; display: flex; flex-direction: column; gap: 24px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
h1, h2, h3, h4, p { margin: 0; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes type { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(2px); } }

/* ---------- top bar ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar-title { display: flex; flex-direction: column; gap: 6px; }
.topbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.sync { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sync.lost { color: var(--error); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.notice { background: var(--error-bg); color: var(--error); border-radius: 10px; padding: 12px 16px; font-size: 14px; }

/* ---------- room ---------- */
.rooms { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
/* Plan 4.1: two columns once a 520px floor fits in each room (2 x (520 + 42) + 20 gap + 32 page padding). */
@media (min-width: 1180px) { .rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.room { background: var(--surface); border: 1px solid #DCE0E5; border-radius: 14px; }
.room-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 16px 20px; }
.room-head h3 { font-size: 17px; font-weight: 600; }
.room-head .path { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.room-head .provider { font-family: var(--mono); font-size: 11px; background: #EEF0F3; border-radius: 999px; padding: 2px 8px; }
.room-head .toggle { margin-left: auto; min-height: 32px; padding: 0 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); font-size: 12.5px; cursor: pointer; }
.room-head .idle { font-size: 12px; color: var(--muted); border: 1px solid var(--line-soft); border-radius: 999px; padding: 2px 8px; }
.room.collapsed .floor-scroll, .room.collapsed .drawer-wrap { display: none; }
.room-errors { margin: 0 20px 16px; display: flex; flex-direction: column; gap: 4px; }
.room-errors:empty { display: none; }
.room-errors p { background: var(--error-bg); color: var(--error); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.floor-scroll { padding: 0 20px 20px; }
.floor { position: relative; width: 520px; margin: 0 auto; height: 176px; border: 1.5px solid var(--wall); border-radius: 10px; background: var(--floor); }

/* whiteboard: Leader 뒤 벽 */
.whiteboard { position: absolute; left: 12px; top: 12px; width: 84px; height: 148px; display: flex; flex-direction: column; gap: 6px; }
.wb-decide, .wb-cr { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; color: var(--muted); cursor: pointer; text-align: left; }
.wb-decide { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: 600; }
.wb-decide .n { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--ink); }
.wb-decide.attn { border-color: var(--decide-line); background: var(--decide-bg); color: var(--decide); }
.wb-decide.attn .n { color: var(--decide); }
.wb-cr { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 10px; font-size: 12px; }
.wb-cr span { display: flex; justify-content: space-between; width: 100%; }
.wb-cr b { font-family: var(--mono); font-weight: 400; color: var(--ink); }
.wb-decide[aria-expanded="true"], .wb-cr[aria-expanded="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }

/* station: desk + worker를 묶은 선택 영역 */
.station { position: absolute; width: 76px; height: 92px; padding: 0; border: 1.5px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; }
.station:hover { background: var(--hover-bg); }
.station[aria-expanded="true"] { background: var(--select-bg); border-color: var(--select-line); }
.station:focus-visible { outline: 2px solid var(--work); outline-offset: 2px; }

/* desk */
.desk, .worker, .leader { pointer-events: none; }
.desk { position: absolute; width: 72px; height: 44px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); }
.desk::before { content: ""; position: absolute; left: 21px; top: 5px; width: 28px; height: 4px; border-radius: 2px; background: var(--wall); }
.desk.empty { border-color: var(--line-soft); }
.desk.empty::before { background: var(--line-faint); }
.desk .id { position: absolute; left: 0; right: 0; top: 11px; text-align: center; font-family: var(--mono); font-size: 10.5px; }
.desk .time { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
.desk.on::before { background: #D6E2FB; }
.desk .typing { position: absolute; left: 26.5px; top: 5.5px; display: flex; gap: 3.5px; }
.desk .typing i { width: 3px; height: 3px; border-radius: 50%; background: var(--work); animation: type 1.2s ease-in-out infinite; }
.desk .typing i:nth-child(2) { animation-delay: .2s; }
.desk .typing i:nth-child(3) { animation-delay: .4s; }
.desk.lead { width: 48px; height: 64px; }
.desk.lead::before { left: auto; right: 5px; top: 18px; width: 4px; height: 24px; }
.desk.lead .time { top: 0; bottom: 0; right: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.3; }

/* worker */
.worker { position: absolute; width: 24px; height: 24px; border-radius: 50%; }
.worker.working { background: var(--work); animation: bob 1.6s ease-in-out infinite; }
.worker.review { border: 2.5px solid var(--work); background: var(--surface); }
.worker.pending { border: 1.5px dashed var(--ghost); }
.worker.stopped { background: var(--stopped); }

/* leader: 동심원 */
.leader { position: absolute; width: 28px; height: 28px; border: 2px solid var(--ink); border-radius: 50%; background: var(--surface); }
.leader::after { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
.leader.working { animation: sway 2.6s ease-in-out infinite; }
.leader.stopped { border-color: var(--stopped); }
.leader.stopped::after { background: var(--stopped); }
.leader.absent { border: 1.5px dashed var(--ghost); background: transparent; }
.leader.absent::after { display: none; }

.label { position: absolute; width: 76px; text-align: center; font-family: var(--mono); font-size: 11px; line-height: 1.3; color: var(--muted); }
.label.lead { width: 100px; }
.label .sub { display: block; }

/* drawer: 펼치면 아래 project가 밀려납니다 */
.drawer-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
.room.is-open .drawer-wrap { grid-template-rows: 1fr; }
.drawer { overflow: hidden; min-height: 0; }
.drawer-inner { border-top: 1px solid #E5E8EC; padding: 20px; background: #FAFBFC; border-radius: 0 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.drawer-head h4 { font-size: 14px; font-weight: 600; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); font-size: 13px; cursor: pointer; }
.btn.primary { border: 0; background: var(--ink); color: #FFFFFF; font-size: 14px; font-weight: 600; padding: 0 18px; }
.btn.primary:disabled { background: #E3E6EA; color: var(--muted); cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid #E1E5EA; border-radius: 8px; padding: 10px 12px; }
.card .id { display: block; font-family: var(--mono); font-size: 12px; }
.card .t { font-size: 13px; color: var(--muted); }
.card.active { border-color: var(--work-line); }
.decide-list { display: flex; flex-direction: column; gap: 12px; }
.decide-card { background: var(--surface); border: 1px solid var(--decide-line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.decide-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.pill-attn { color: var(--decide); background: var(--decide-bg); border-radius: 999px; padding: 2px 8px; }
.decide-card label { font-size: 12px; font-weight: 600; margin-top: 4px; }
.decide-card textarea { font-size: 14px; padding: 10px 12px; border: 1px solid #C9CFD8; border-radius: 8px; resize: vertical; }
.send-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.send-status { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.send-status.done { font-family: var(--sans); font-size: 13px; color: #1D4ED8; }
.send-status.failed { font-family: var(--sans); font-size: 13px; color: var(--error); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.col-title { font-size: 12px; font-weight: 600; color: var(--muted); }
.kv { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; font-size: 13px; }
.kv dt { font-size: 11.5px; color: var(--muted); }
.kv dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.excerpt { font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 10px; max-height: 320px; overflow: auto; }
.excerpt > strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* item text rendered from Markdown by project_item */
.md { font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 8px; }
.md h3, .md strong { color: var(--ink); }
.md h3 { font-size: 13.5px; margin: 8px 0 4px; }
.md code { font-family: var(--mono); font-size: 12px; background: #F1F3F5; border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }
.md pre { font-family: var(--mono); font-size: 12px; background: #F1F3F5; border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.md blockquote { margin: 0 0 8px; padding: 2px 0 2px 12px; border-left: 3px solid #D5DAE1; }
.md blockquote > :first-child { margin-top: 0; }
.md blockquote > :last-child { margin-bottom: 0; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; }
.md th, .md td { border: 1px solid #E1E5EA; padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: #F6F7F9; color: var(--ink); }
.md-label { font-size: 12px; font-weight: 600; color: var(--ink); }

/* Motion shows the state, so it runs whatever the OS motion setting is (plan 4.5). */
</style>
</head>
<body>
<div class="page">
    <header class="topbar">
        <div class="topbar-title">
            <h1>노냐?</h1>
            <p class="sync" id="sync" role="status">불러오는 중…</p>
        </div>
        <ul class="legend">
            <li><span class="dot" style="background: var(--work)"></span>작업 중</li>
            <li><span class="dot" style="border: 2px solid var(--work); background: #FFFFFF"></span>Review 대기</li>
            <li><span class="dot" style="background: var(--stopped)"></span>멈춤</li>
            <li><span class="dot" style="border-radius: 3px; background: var(--select-bg); border: 1px solid var(--select-line)"></span>선택</li>
            <li><span class="dot" style="border-radius: 3px; background: var(--decide-bg); border: 1px solid #E8A77E"></span>결정 대기</li>
        </ul>
    </header>
    <p class="notice" id="notice" hidden></p>
    <div class="rooms" id="rooms"></div>
</div>

<script>
(function () {
    'use strict';
    var TOKEN = document.querySelector('meta[name="board-token"]').content;
    var BOARD_MS = 2000, LIVE_MS = 10000;
    var SEATS_PER_ROW = 4, SEAT_X = 200, SEAT_STEP = 78, ROW_STEP = 130, FLOOR_HEIGHT = 176;   // floor geometry (px), plan 4.1
    var UNCONFIRMED = ['send_unconfirmed', 'delivery_unconfirmed'];   // the Leader may have the answer already
    var roomsEl = document.getElementById('rooms');
    var syncEl = document.getElementById('sync');
    var noticeEl = document.getElementById('notice');

    // Page state that survives every redraw. The server keeps none.
    // Keys are registered project names, which may be any nonempty string ("constructor" too),
    // so no table inherits Object.prototype.
    function table() { return Object.create(null); }
    function own(object, key) { return object != null && Object.prototype.hasOwnProperty.call(object, key) ? object[key] : undefined; }
    var ui = { open: table(), expanded: table(), drafts: table(), sending: table(), status: table(),
               live: table(), data: null, rooms: new Map() };

    // ------------------------------------------------------------ format
    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    // Plan 4.2: 1d 4h 12m. Leading zero units are dropped; minutes always show.
    function units(seconds) {
        if (seconds == null) return ['?'];
        var d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600), m = Math.floor(seconds % 3600 / 60);
        var out = [];
        if (d) out.push(d + 'd');
        if (d || h) out.push(h + 'h');
        out.push(m + 'm');
        return out;
    }
    function since(seconds) { return units(seconds).join(' '); }
    function setHTML(el, html) {
        if (el._html !== html) { el.innerHTML = html; el._html = html; }
    }

    // ------------------------------------------------------------ state
    var LABEL = { working: '작업 중', pending: '연결 중', review_wait: 'review 대기', reviewing: 'review 중',
                  stopped: '멈춤', unknown: '확인 불가', empty: '빈 자리' };

    // Plan 7.2: a verdict counts only for the session it judged; files and liveness refresh apart.
    function liveOf(p, key, sessionId) {
        var live = own(ui.live, p.id), verdict = live && !own(live, 'error') ? own(live, key) : undefined;
        return verdict && verdict.session_id === sessionId ? verdict.state : undefined;
    }
    // Plan 4.3: stopped first, then the file-based states.
    function seatStatus(p, seat) {
        var live = seat.session ? liveOf(p, String(seat.index), seat.session_id) : undefined;
        return live === 'stopped' || live === 'unknown' ? live : seat.status;
    }
    function leaderStatus(p) {
        if (!p.leader) return 'absent';
        var live = liveOf(p, 'leader', p.leader.session_id);
        return live === 'stopped' || live === 'unknown' ? live : 'working';
    }
    function counts(p) {
        var c = p.crs || {};
        return { open: (c.open || []).length, todo: (c.todo || []).length, run: (c['in-progress'] || []).length };
    }
    // Plan 7.3: a room with nothing to do folds to its head.
    function idle(p) {
        var c = counts(p);
        return !p.leader && !p.seats.some(function (s) { return s.job_id; })
            && !(p.decide && p.decide.length) && !c.open && !c.todo && !c.run && !p.errors.length;
    }
    function seatOfJob(p, job) {
        var s = p.seats.filter(function (x) { return x.job_id === job; })[0];
        return s ? s : null;
    }

    // ------------------------------------------------------------ head
    function headHTML(p) {
        var fold = idle(p);
        return '<h3>' + esc(p.id) + '</h3>'
            + '<span class="path">' + esc(p.base_display) + '</span>'
            + '<span class="provider">' + esc(p.provider) + '</span>'
            + (fold ? '<span class="idle">할 일 없음</span>' : '')
            + (fold ? '<button type="button" class="toggle" data-toggle aria-expanded="' + !!ui.expanded[p.id] + '">'
                      + (ui.expanded[p.id] ? '접기' : '펼치기') + '</button>' : '');
    }

    // ------------------------------------------------------------ floor
    function floorHTML(p) {
        var open = ui.open[p.id] || '';
        var html = '<div class="whiteboard">';
        if (p.decide) {
            var n = p.decide.length;
            html += '<button type="button" class="wb-decide' + (n ? ' attn' : '') + '" data-open-key="decide" aria-expanded="'
                + (open === 'decide') + '" aria-label="결정 대기 ' + n + '건"><span>결정</span><span class="n">' + n + '</span></button>';
        }
        if (p.crs) {
            var c = counts(p);
            html += '<button type="button" class="wb-cr" data-open-key="cr" aria-expanded="' + (open === 'cr')
                + '" aria-label="CR open ' + c.open + ', todo ' + c.todo + ', 진행 ' + c.run + '">'
                + '<span>open<b>' + c.open + '</b></span><span>todo<b>' + c.todo + '</b></span><span>진행<b>' + c.run + '</b></span></button>';
        }
        html += '</div>';

        var ls = leaderStatus(p);
        var away = p.leader && p.leader.reviewing_seat != null;
        var leadTime = p.leader ? units(p.leader.elapsed).map(function (u) { return '<span>' + u + '</span>'; }).join('') : '';
        html += '<div class="desk lead" style="left: 134px; top: 56px" aria-hidden="true"><span class="time">' + leadTime + '</span></div>';
        var home = ls === 'absent' || away ? 'absent' : ls === 'working' ? 'working' : 'stopped';
        html += '<span class="leader ' + home + '" style="left: 102px; top: 74px" aria-hidden="true"></span>';
        var leadLabel = ls === 'absent' ? 'leader 없음' : away ? 'leader → seat' + p.leader.reviewing_seat : 'leader';
        var leadSub = ls === 'stopped' || ls === 'unknown' ? '<span class="sub">' + esc(LABEL[ls]) + '</span>' : '';
        html += '<span class="label lead" style="left: 98px; top: 128px">' + esc(leadLabel) + ' ' + leadSub + '</span>';

        p.seats.forEach(function (seat) {
            var x = SEAT_X + SEAT_STEP * (seat.index % SEATS_PER_ROW), y = ROW_STEP * Math.floor(seat.index / SEATS_PER_ROW);
            var st = seatStatus(p, seat), key = 'w' + seat.index;
            var time = seat.session ? since(seat.elapsed) : '';
            if (seat.job_id) {
                html += '<button type="button" class="station" style="left: ' + (x - 2) + 'px; top: ' + (y + 26) + 'px" data-open-key="' + key
                    + '" aria-expanded="' + (open === key) + '" aria-label="seat' + seat.index + ', ' + esc(seat.job_id) + ' '
                    + LABEL[st] + (time ? ', session ' + time : '') + '"></button>';
            }
            var deskClass = !seat.job_id ? 'desk empty' : st === 'working' ? 'desk on' : 'desk';
            html += '<div class="' + deskClass + '" style="left: ' + x + 'px; top: ' + (y + 36) + 'px" aria-hidden="true">'
                + (seat.job_id ? '<span class="id">' + esc(seat.job_id) + '</span>' : '')
                + (time ? '<span class="time">' + time + '</span>' : '')
                + (st === 'working' ? '<span class="typing"><i></i><i></i><i></i></span>' : '') + '</div>';
            if (seat.job_id) {
                var worker = st === 'working' ? 'working' : st === 'pending' ? 'pending'
                    : st === 'stopped' || st === 'unknown' ? 'stopped' : 'review';
                html += '<span class="worker ' + worker + '" style="left: ' + (x + 24) + 'px; top: ' + (y + 84) + 'px" aria-hidden="true"></span>';
            }
            if (away && p.leader.reviewing_seat === seat.index) {
                html += '<span class="leader ' + (ls === 'working' ? 'working' : 'stopped') + '" style="left: ' + (x + 50)
                    + 'px; top: ' + (y + 82) + 'px" aria-hidden="true"></span>';
            }
            var sub = seat.job_id && st !== 'working' ? '<span class="sub">' + esc(LABEL[st]) + '</span>' : '';
            html += '<span class="label" style="left: ' + (x - 2) + 'px; top: ' + (y + 122) + 'px">seat' + seat.index + ' ' + sub + '</span>';
        });
        // Plan 4.1: 4 seats a row; the floor grows by rows, never by width.
        var rows = Math.max(1, Math.ceil(p.seats.length / SEATS_PER_ROW));
        return { html: html, height: FLOOR_HEIGHT + ROW_STEP * (rows - 1) };
    }

    // ------------------------------------------------------------ drawer panels
    function closeButton() { return '<button type="button" class="btn" data-close>닫기</button>'; }

    function crPanelHTML(p) {
        var c = p.crs || {}, total = counts(p);
        var cols = [['open', c.open || []], ['todo', c.todo || []], ['in-progress', c['in-progress'] || []]];
        var html = '<div class="drawer-head"><h4>CR · ' + (total.open + total.todo + total.run) + '</h4>' + closeButton() + '</div><div class="cols">';
        cols.forEach(function (col) {
            html += '<div class="col"><p class="col-title">' + col[0] + ' · ' + col[1].length + '</p>';
            col[1].forEach(function (item) {
                var seat = col[0] === 'in-progress' ? seatOfJob(p, item.id) : null;
                var where = seat ? ' · seat' + seat.index + (seatStatus(p, seat) !== 'working' ? ' · ' + LABEL[seatStatus(p, seat)] : '') : '';
                html += '<div class="card' + (seat ? ' active' : '') + '"><span class="id">' + esc(item.id) + esc(where)
                    + '</span><span class="t">' + esc(item.title) + '</span></div>';
            });
            html += '</div>';
        });
        return html + '</div>';
    }

    function seatPanelHTML(p, seat) {
        var st = seatStatus(p, seat), cr = seat.cr;
        var head = '<div class="drawer-head"><h4><span class="mono">seat' + seat.index + ' · ' + esc(seat.job_id) + '</span>'
            + (seat.title ? ' — ' + esc(seat.title) : '') + '</h4>' + closeButton() + '</div>';
        var result = !cr ? '—' : cr.mode === 'read-only' ? (cr.result_html ? '결과 있음 (read-only)' : '결과 없음 (read-only)')
            : cr.submitted ? '<span class="mono">' + esc(cr.submitted.slice(0, 12)) + '</span>' : '제출 없음';
        var html = head + '<dl class="kv">'
            + '<div class="card"><dt>상태</dt><dd>' + esc((cr ? cr.state : 'CR이 in-progress에 없음') + ' · ' + LABEL[st]) + '</dd></div>'
            + '<div class="card"><dt>Session</dt><dd class="mono">' + (seat.session ? since(seat.elapsed) : '연결 전') + '</dd></div>'
            + (cr && cr.branch ? '<div class="card"><dt>Branch</dt><dd class="mono">' + esc(cr.branch) + '</dd></div>' : '')
            + (cr && cr.base ? '<div class="card"><dt>Base</dt><dd class="mono">' + esc(cr.base.slice(0, 12)) + '</dd></div>' : '')
            + '<div class="card"><dt>Result</dt><dd>' + result + '</dd></div></dl>';
        if (cr && cr.result_html) html += '<div class="card excerpt md"><strong>Result (마지막 제출)</strong>' + cr.result_html + '</div>';
        if (cr && cr.contract_html) html += '<div class="card excerpt md"><strong>Contract</strong>' + cr.contract_html + '</div>';
        return html;
    }

    function sendBlock(p) {
        var ls = leaderStatus(p);
        if (ls === 'absent') return 'Leader 없음';
        if (ls === 'stopped') return 'Leader 멈춤';
        return '';
    }

    function decideBodyHTML(item) {
        var meta = '<div class="decide-meta"><span class="mono" style="font-size: 12.5px; color: var(--ink)">' + esc(item.id) + '</span>'
            + (item.urgency === 'high' ? '<span class="pill-attn">urgency high</span>' : '<span>urgency ' + esc(item.urgency) + '</span>')
            + (item.blocks ? '<span>blocks ' + esc(item.blocks) + '</span>' : '')
            + (item.opened ? '<span>' + esc(item.opened) + '</span>' : '') + '</div>';
        var body = item.sections.map(function (s) {
            return '<div class="md"><p class="md-label">' + esc(s.name) + '</p>' + s.html + '</div>';
        }).join('');
        return meta + '<p style="font-size: 15px; font-weight: 600">' + esc(item.title) + '</p>' + body;
    }

    function syncDecidePanel(panel, p) {
        var items = p.decide || [];
        var head = items.length
            ? '<div class="drawer-head"><h4>결정 대기 · ' + items.length + '</h4>' + closeButton() + '</div>'
            : '<div class="drawer-head"><p class="muted" style="font-size: 14px">결정 대기 항목이 없습니다.</p>' + closeButton() + '</div>';
        if (!panel._head) {
            panel.innerHTML = '<div data-part="head"></div><div class="decide-list" data-part="list"></div>';
            panel._head = panel.querySelector('[data-part="head"]');
            panel._list = panel.querySelector('[data-part="list"]');
        }
        setHTML(panel._head, head);
        var keep = {};
        var block = sendBlock(p);
        items.forEach(function (item) {
            var key = p.id + '/' + item.id;
            keep[item.id] = true;
            var card = panel._list.querySelector('[data-decide="' + CSS.escape(item.id) + '"]');
            if (!card) {
                // The textarea is created once per item, so a redraw never drops what the user typed.
                card = document.createElement('div');
                card.className = 'decide-card';
                card.dataset.decide = item.id;
                var area = 'ans-' + p.id + '-' + item.id;
                card.innerHTML = '<div data-part="body"></div><label for="' + esc(area) + '">답변</label>'
                    + '<textarea id="' + esc(area) + '" rows="3" placeholder="예: A로 진행합니다."></textarea>'
                    + '<div class="send-row"><button type="button" class="btn primary" data-send></button>'
                    + '<span class="send-status" role="status"></span></div>';
                var textarea = card.querySelector('textarea');
                textarea.value = ui.drafts[key] || '';
                textarea.addEventListener('input', function () { ui.drafts[key] = textarea.value; });
                card.querySelector('[data-send]').addEventListener('click', function () { sendAnswer(p.id, item.id, card); });
                panel._list.appendChild(card);
            }
            setHTML(card.querySelector('[data-part="body"]'), decideBodyHTML(item));
            var button = card.querySelector('[data-send]');
            button.disabled = !!block || !!ui.sending[key];
            button.textContent = block || (ui.sending[key] ? '보내는 중…' : p.id + ' Leader에게 보내기');
            var status = ui.status[key] || (block ? { text: 'Leader가 연결되면 보낼 수 있습니다.', cls: '' }
                                                  : { text: 'agent-session send --job leader', cls: '' });
            var out = card.querySelector('.send-status');
            out.textContent = status.text;
            out.className = 'send-status' + (status.cls ? ' ' + status.cls : '');
        });
        Array.prototype.slice.call(panel._list.children).forEach(function (card) {
            if (!keep[card.dataset.decide]) card.remove();
        });
    }

    function sendAnswer(pid, decideId, card) {
        var key = pid + '/' + decideId;
        var answer = card.querySelector('textarea').value;
        if (!answer.trim()) {
            ui.status[key] = { text: '답변을 입력하십시오.', cls: 'failed' };
            return draw();
        }
        ui.sending[key] = true;
        delete ui.status[key];
        draw();
        var textarea = card.querySelector('textarea');
        fetch('/api/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Board-Token': TOKEN },
            body: JSON.stringify({ project: pid, decide_id: decideId, answer: answer })
        }).then(function (r) { return r.json(); }).then(function (out) {
            if (out.ok) {
                // Text edited while the answer was on its way is a new, unsent draft: keep it.
                var edited = textarea.value !== answer;
                ui.status[key] = { text: '전송했습니다. 항목 이동은 Leader가 합니다.'
                                   + (edited ? ' 전송 중에 고친 내용은 보내지 않았습니다.' : ''), cls: 'done' };
                if (!edited) {
                    ui.drafts[key] = '';
                    textarea.value = '';
                }
            } else {
                var e = out.error || {};
                var detail = (e.code || 'error') + (e.message ? ' — ' + e.message : '');
                ui.status[key] = UNCONFIRMED.indexOf(e.code) >= 0
                    ? { text: '수신 여부를 확인하지 못했습니다: ' + detail + '. Leader 화면에서 받았는지 확인한 뒤 다시 보내십시오.', cls: 'failed' }
                    : { text: '전송하지 못했습니다: ' + detail, cls: 'failed' };
            }
        }).catch(function (error) {
            ui.status[key] = { text: '전송하지 못했습니다: ' + error, cls: 'failed' };
        }).then(function () {
            delete ui.sending[key];
            draw();
        });
    }

    // ------------------------------------------------------------ room
    function makeRoom(p) {
        var room = document.createElement('article');
        room.className = 'room';
        room.setAttribute('aria-label', p.id);
        room.innerHTML = '<div class="room-head"></div><div class="room-errors"></div>'
            + '<div class="floor-scroll"><div class="floor"></div></div>'
            + '<div class="drawer-wrap"><div class="drawer"><div class="drawer-inner">'
            + '<div data-panel="decide" hidden></div><div data-panel="cr" hidden></div><div data-panel="seat" hidden></div>'
            + '</div></div></div>';
        var pid = p.id;
        room.addEventListener('click', function (event) {
            var t = event.target.closest('[data-open-key], [data-close], [data-toggle]');
            if (!t || !room.contains(t)) return;
            if (t.hasAttribute('data-toggle')) {
                ui.expanded[pid] = !ui.expanded[pid];
            } else if (t.hasAttribute('data-close')) {
                ui.open[pid] = '';
            } else {
                ui.open[pid] = ui.open[pid] === t.dataset.openKey ? '' : t.dataset.openKey;
            }
            draw();
        });
        return room;
    }

    function drawRoom(room, p) {
        var open = ui.open[p.id] || '';
        // A panel whose subject left (seat released, path unset) closes.
        if (open === 'decide' && !p.decide || open === 'cr' && !p.crs) open = '';
        if (open.charAt(0) === 'w') {
            var s = p.seats[Number(open.slice(1))];
            if (!s || !s.job_id) open = '';
        }
        ui.open[p.id] = open;
        var fold = idle(p) && !ui.expanded[p.id];
        room.classList.toggle('collapsed', fold);
        setHTML(room.querySelector('.room-head'), headHTML(p));
        setHTML(room.querySelector('.room-errors'), p.errors.map(function (e) {
            return '<p>' + esc(e.source) + ': ' + esc(e.code) + ' — ' + esc(e.message) + '</p>';
        }).join(''));
        var floor = floorHTML(p), floorEl = room.querySelector('.floor');
        floorEl.style.height = floor.height + 'px';
        setHTML(floorEl, floor.html);
        var drawer = room.querySelector('.drawer');
        room.classList.toggle('is-open', open !== '' && !fold);
        drawer.inert = open === '' || fold;
        var panels = { decide: room.querySelector('[data-panel="decide"]'), cr: room.querySelector('[data-panel="cr"]'),
                       seat: room.querySelector('[data-panel="seat"]') };
        if (p.decide) syncDecidePanel(panels.decide, p);
        if (p.crs) setHTML(panels.cr, crPanelHTML(p));
        if (open.charAt(0) === 'w') setHTML(panels.seat, seatPanelHTML(p, p.seats[Number(open.slice(1))]));
        // Keep the last panel visible while the drawer closes.
        if (open !== '') {
            panels.decide.hidden = open !== 'decide';
            panels.cr.hidden = open !== 'cr';
            panels.seat.hidden = open.charAt(0) !== 'w';
        }
    }

    function draw() {
        var data = ui.data;
        if (!data) return;
        noticeEl.hidden = !data.error;
        if (data.error) noticeEl.textContent = '등록을 읽지 못했습니다: ' + data.error.code + ' — ' + data.error.message;
        var seen = new Set();
        data.projects.forEach(function (p, index) {
            seen.add(p.id);
            if (!ui.rooms.has(p.id)) ui.rooms.set(p.id, makeRoom(p));
            var room = ui.rooms.get(p.id);
            if (roomsEl.children[index] !== room) roomsEl.insertBefore(room, roomsEl.children[index] || null);
            drawRoom(room, p);
        });
        Array.from(ui.rooms.keys()).forEach(function (id) {
            if (!seen.has(id)) { ui.rooms.get(id).remove(); ui.rooms.delete(id); }
        });
        if (!data.projects.length && !data.error) {
            noticeEl.hidden = false;
            noticeEl.textContent = '등록된 project가 없습니다.';
        }
    }

    // ------------------------------------------------------------ polling
    function clock() {
        var d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, '0'); }).join(':');
    }
    function pollBoard() {
        fetch('/api/board', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
            ui.data = data;
            syncEl.textContent = '2초마다 갱신 · 마지막 ' + clock();
            syncEl.classList.remove('lost');
            draw();
        }).catch(function () {
            syncEl.textContent = 'server에 연결할 수 없습니다 · 마지막 화면을 보여 줍니다';
            syncEl.classList.add('lost');
        }).then(function () { setTimeout(pollBoard, BOARD_MS); });
    }
    function pollLive() {
        fetch('/api/live', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (out) {
            ui.live = out.ok && out.data ? out.data : table();
            draw();
        }).catch(function () {}).then(function () { setTimeout(pollLive, LIVE_MS); });
    }
    pollBoard();
    pollLive();
})();
</script>
</body>
</html>
